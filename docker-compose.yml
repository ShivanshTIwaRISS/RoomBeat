version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: roombeat-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roombeat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roombeat_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-roombeat}
    volumes:
      - roombeat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roombeat']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  roombeat_pgdata:

