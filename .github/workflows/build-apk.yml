name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build RoomBeat Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: Build Standalone Android APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk build-output/RoomBeat.apk
          else
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/RoomBeat.apk
          fi
          ls -lh build-output/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoomBeat-Android-APK
          path: build-output/RoomBeat.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "RoomBeat Android APK v1.0.0"
          body: |
            ### RoomBeat Android Application
            Production build of RoomBeat Synchronized Multi-Device Audio System.
            
            - Download `RoomBeat.apk` below and install directly on your Android phone.
            - Ensure both host and phone speakers are on the same Wi-Fi network.
          files: build-output/RoomBeat.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
